<div class="page-wrapper">

  <h2 class="page-title">Add Employee</h2>

  <mat-card class="employee-card">

    <form [formGroup]="employeeForm" (ngSubmit)="submit()">

      <div class="form-grid">

        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Employee ID</mat-label>
          <input matInput formControlName="employee_id" />
          <mat-error *ngIf="employeeForm.get('employee_id')?.hasError('required')
                   && employeeForm.get('employee_id')?.touched">
            Employee ID is required
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Full Name</mat-label>
          <input matInput formControlName="full_name" />
          <mat-error *ngIf="employeeForm.get('full_name')?.hasError('required')
                   && employeeForm.get('full_name')?.touched">
            Full Name is required
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" />
          <mat-error *ngIf="employeeForm.get('email')?.hasError('required')
                   && employeeForm.get('email')?.touched">
            Email is required
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Department</mat-label>
          <input matInput formControlName="department" />
          <mat-error *ngIf="employeeForm.get('department')?.hasError('required')
                   && employeeForm.get('department')?.touched">
            Department is required
          </mat-error>
        </mat-form-field>

      </div>

      <div class="actions">
        <button mat-raised-button color="primary" type="submit"
          [disabled]="employeeForm.invalid || submitting">
          Save Employee
        </button>
        <button mat-button routerLink="/employees">Cancel</button>
      </div>

    </form>

  </mat-card>

</div>
