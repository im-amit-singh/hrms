<div class="page-wrapper">

  <h2 class="page-title">Employees</h2>

  <div class="toolbar">
    <button
      mat-raised-button
      color="primary"
      routerLink="/employees/add">
      Add Employee
    </button>

    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Search</mat-label>
      <input
        matInput
        (keyup)="applyFilter($event)"
        placeholder="Search employee">
    </mat-form-field>
  </div>

  <mat-card>

    <div *ngIf="loading">Loading employees...</div>
    <div *ngIf="error" class="text-danger">{{ error }}</div>

    <table
      mat-table
      [dataSource]="dataSource"
      class="mat-elevation-z2"
      *ngIf="!loading">

      <!-- Employee ID -->
      <ng-container matColumnDef="employee_id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let emp">{{ emp.employee_id }}</td>
      </ng-container>

      <!-- Name -->
      <ng-container matColumnDef="full_name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let emp">{{ emp.full_name }}</td>
      </ng-container>

      <!-- Email -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let emp">{{ emp.email }}</td>
      </ng-container>

      <!-- Department -->
      <ng-container matColumnDef="department">
        <th mat-header-cell *matHeaderCellDef>Department</th>
        <td mat-cell *matCellDef="let emp">{{ emp.department }}</td>
      </ng-container>

      <!-- Actions -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let emp">
          <button
            mat-button
            color="warn"
            (click)="deleteEmployee(emp.id!)">
            Delete
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator
      [pageSizeOptions]="[5, 10, 25]"
      showFirstLastButtons>
    </mat-paginator>

  </mat-card>

</div>
