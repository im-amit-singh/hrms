<mat-sidenav-container class="admin-container">

  <!-- Sidebar -->
  <mat-sidenav
    #drawer
    class="admin-sidenav"
    [mode]="isMobile ? 'over' : 'side'"
    [disableClose]="!isMobile"
    [opened]="!isMobile">

    <app-sidebar
      (closeSidebar)="isMobile && drawer.close()">
    </app-sidebar>
  </mat-sidenav>

  <!-- Main Content -->
  <mat-sidenav-content>

    <app-navbar
        [isMobile]="isMobile"
        (menuToggle)="isMobile && drawer.toggle()">
    </app-navbar>

    <div class="page-content">
      <router-outlet></router-outlet>
    </div>

  </mat-sidenav-content>

</mat-sidenav-container>
